generated: '2026-08-13'
method: searched
source: https://docs.aws.amazon.com/cli/latest/reference/cleanrooms/
docs: https://docs.aws.amazon.com/cli/latest/reference/cleanrooms/
name: aws cleanrooms
description: >-
  AWS Clean Rooms has no dedicated CLI binary. It is a service namespace inside
  the AWS CLI — every Clean Rooms API action is exposed as
  `aws cleanrooms <kebab-case-operation>`, generated from the same service model
  as the SDKs, so the command surface tracks the API 1:1.
binary: aws
namespace: cleanrooms
official: true
install:
  - method: installer
    platform: macos
    command: >-
      curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg" &&
      sudo installer -pkg AWSCLIV2.pkg -target /
  - method: installer
    platform: linux
    command: >-
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o
      "awscliv2.zip" && unzip awscliv2.zip && sudo ./aws/install
  - method: installer
    platform: windows
    command: msiexec.exe /i https://awscli.amazonaws.com/AWSCLIV2.msi
  - method: package
    registry: pypi
    command: pip install awscli
auth:
  model: AWS SigV4 via configured credentials
  configure: aws configure
  note: >-
    Uses the standard AWS credential chain (profiles, environment variables,
    SSO, instance/role credentials). No Clean Rooms-specific credential.
