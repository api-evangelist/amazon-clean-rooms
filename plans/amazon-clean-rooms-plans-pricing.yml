note: >-
  AWS Clean Rooms publishes no named subscription tiers — there is no Free /
  Pro / Enterprise ladder to record. It is priced purely on metered consumption
  (compute measured in CRPU-hours, plus per-record ML and Entity Resolution
  charges and per-GB intermediate table storage), billed through the AWS account
  with no separate signup. plan_count is therefore an honest 0; the metered
  dimensions the provider actually publishes are captured in dimensions[] below.
  Prices are the published US East (N. Virginia) rates; AWS varies rates by
  Region.
free_tier:
  available: false
  note: >-
    The pricing page states the AWS Free Tier is not available for PySpark in
    AWS Clean Rooms, AWS Clean Rooms ML, or AWS Entity Resolution.
