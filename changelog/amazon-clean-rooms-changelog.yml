note: >-
  AWS Clean Rooms does not publish a semver product changelog. The dated
  Document history for the AWS Clean Rooms User Guide is the canonical change
  record and is RSS-subscribable. Entries below are the recent window, verbatim
  titles with published dates. The API itself is versioned by API-version date
  (2022-02-17) and has never had a breaking version bump; capability changes
  arrive as additive operations and fields.
